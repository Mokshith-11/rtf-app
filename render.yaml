databases:
  - name: rtf-db
    plan: free
    databaseName: rtf
    user: rtf

services:
  - type: web
    name: rtf
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev --prefix RTF-backend && npm --prefix RTF-backend run db:generate && npm --prefix RTF-backend run build
    startCommand: npx prisma db push --schema=RTF-backend/prisma/schema.prisma && npm --prefix RTF-backend run db:seed && node RTF-backend/dist/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rtf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@gmail.com
      - key: ADMIN_PASSWORD
        value: Password@123456

